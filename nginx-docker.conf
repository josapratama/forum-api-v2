worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream forum_api {
        server 127.0.0.1:5000;
        keepalive 64;
    }

    # Rate limiting: 90 requests per minute
    limit_req_zone $binary_remote_addr zone=threads_limit:10m rate=90r/m;

    server {
        listen 8080;
        server_name _;

        # /threads dan semua sub-path → rate limited 90 req/menit
        location /threads {
            limit_req zone=threads_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://forum_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Semua route lain tanpa rate limit
        location / {
            proxy_pass http://forum_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
